<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deco - Label Printer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'roboto-condensed': ['"Roboto Condensed"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto Condensed', sans-serif;
      }

      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #d1d5db;
        pointer-events: none;
        display: block;
      }

      @media print {
        @page {
          size: 4in 6in;
          margin: 0;
        }

        body {
          margin: 0;
          padding: 0;
          background: white;
          overflow: visible !important;
        }

        .no-print, #root > div.flex {
          display: none !important;
        }
      }
    </style>
    <script type="module" crossorigin src="/label-printer/assets/index-Widp1yCZ.js"></script>
  </head>
  <body class="bg-gray-100 h-screen overflow-hidden font-roboto-condensed">
    <div id="root"></div>
  </body>
</html>
